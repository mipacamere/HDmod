<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Manager - Mappature</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">🏨 Channel Manager</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <a class="nav-link active" href="mappings.html">Mappature</a>
                <a class="nav-link" href="logs.html">Log</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Mappature Camere/Tariffe</h2>
        <p class="text-muted">Visualizza le mappature tra HotelDruid e gli OTA</p>

        <div id="mappings-container">
            <!-- Le mappature verranno caricate qui -->
        </div>
    </div>

    <script>
        const API_KEY = 'MiaChiaveSegretaSuperComplessa_2026';
        const API_BASE = '../';

        async function loadMappings() {
            try {
                const response = await fetch(`${API_BASE}get_properties.php`, {
                    headers: { 'X-API-KEY': API_KEY }
                });
                const data = await response.json();
                
                if (data.success) {
                    renderMappings(data.data);
                }
            } catch (error) {
                console.error('Errore:', error);
            }
        }

        function renderMappings(properties) {
            const container = document.getElementById('mappings-container');
            container.innerHTML = '';
            
            Object.values(properties).forEach(prop => {
                let html = `<div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">${prop.name}</h5>
                    </div>
                    <div class="card-body">`;
                
                Object.entries(prop.channels).forEach(([channelName, channelData]) => {
                    html += `<h6 class="mt-3">${channelName.toUpperCase()}</h6>`;
                    html += `<table class="table table-sm table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>HD Rate ID</th>
                                <th>Camera ID</th>
                                <th>OTA Room ID</th>
                                <th>OTA Rate Name</th>
                            </tr>
                        </thead>
                        <tbody>`;
                    
                    // Nota: Per vedere i dettagli completi delle mappature, 
                    // dovremmo creare un endpoint che restituisca anche i dettagli
                    // Per ora mostriamo solo il conteggio
                    html += `<tr>
                        <td colspan="4" class="text-center text-muted">
                            ${channelData.mappings_count} mappature configurate
                        </td>
                    </tr>`;
                    
                    html += `</tbody></table>`;
                });
                
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        loadMappings();
    </script>
</body>
</html>
